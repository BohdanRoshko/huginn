# Interactive macOS desktop on the CI runner, reachable over Tailscale.
#
# Manual dispatch only — it holds a runner open doing nothing but waiting for
# you, so it must never fire on push.
#
# SECURITY: this joins a shared, public GitHub runner to your tailnet. Use an
# EPHEMERAL, TAGGED auth key and an ACL that stops tag:ci initiating
# connections to anything else on the network. Without that, a machine you do
# not control can reach every device you own.

name: VNC (manual)

on:
  workflow_dispatch:
    inputs:
      minutes:
        description: "How long to hold the desktop open (max 300)"
        required: false
        default: "45"

env:
  WHISPER_TAG: v1.9.2

jobs:
  desktop:
    runs-on: macos-14
    timeout-minutes: 310

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore cached whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: prebuilt/whisper-cli
          key: whisper-cli-${{ env.WHISPER_TAG }}-arm64-metal-v1

      - name: Build and assemble Huginn.app
        run: |
          set -euo pipefail
          swift build -c release
          swift build -c release --show-bin-path > .binpath

          APP="$HOME/Applications/Huginn.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp "$(cat .binpath)/Huginn" "$APP/Contents/MacOS/Huginn"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

          if [ -f prebuilt/whisper-cli ]; then
            cp prebuilt/whisper-cli "$APP/Contents/Resources/whisper-cli"
            chmod +x "$APP/Contents/Resources/whisper-cli"
          else
            echo "::warning::whisper-cli cache miss — transcription will not work in this session"
          fi

          chmod +x "$APP/Contents/MacOS/Huginn"
          codesign --force --sign - --timestamp=none "$APP/Contents/MacOS/Huginn" || true
          codesign --force --sign - --timestamp=none "$APP" || true
          echo "App at $APP"

      - name: Cache speech model
        id: model-cache
        uses: actions/cache@v4
        with:
          path: ~/model/ggml-base.en.bin
          key: whisper-model-base-en-v1

      - name: Fetch speech model
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          mkdir -p ~/model
          curl -sSL --fail -o ~/model/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin

      # base.en (142MB) stands in for the app's large-v3-turbo (1.6GB) so the
      # session starts in seconds rather than minutes. whisper.cpp loads a model
      # by content, not filename, so putting it where the app expects makes the
      # app fully functional — with lower accuracy than production, which is an
      # acceptable trade for an interactive poke-around.
      - name: Install model where the app looks for it
        run: |
          set -euo pipefail
          SUPPORT="$HOME/Library/Application Support/Huginn"
          mkdir -p "$SUPPORT/Models" "$SUPPORT/Recordings"
          cp ~/model/ggml-base.en.bin "$SUPPORT/Models/ggml-large-v3-turbo.bin"
          ls -lh "$SUPPORT/Models/"

      # Whether this runner exposes a microphone at all decides if Start
      # Recording can get past its first step, so surface it rather than let it
      # be discovered by a confusing failure inside the app.
      - name: Audio devices present on this runner
        continue-on-error: true
        run: |
          echo "--- input/output devices ---"
          system_profiler SPAudioDataType 2>/dev/null | sed -n '1,60p' || echo "(none reported)"

      # A double-clickable noisemaker: system audio is what the "Them" track
      # captures, and a headless runner is otherwise silent, so there would be
      # nothing for ScreenCaptureKit to record.
      - name: Put a test-audio script on the Desktop
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Desktop"
          cat > "$HOME/Desktop/play-test-audio.command" <<'SH'
          #!/bin/bash
          # Run this WHILE Huginn is recording to give the "Them" track something
          # to capture — it plays through system audio, exactly like a caller.
          say -v Daniel "This is the far side of the call speaking. \
          The quarterly inventory report is ready for review. \
          Let us confirm the second track is being captured correctly."
          echo "done - now stop the recording in Huginn"
          read -n 1 -s
          SH
          chmod +x "$HOME/Desktop/play-test-audio.command"
          echo "Desktop script ready"

      # Uses ARD's own VNC password rather than the runner account's password:
      # `dscl -passwd` demands the existing password even under sudo, which CI
      # does not have. The legacy-VNC path sets a dedicated password and needs
      # no account credentials at all.
      #
      # The password comes from a secret because this repository is public and
      # workflow logs are readable by anyone.
      - name: Enable screen sharing
        env:
          VNC_PASSWORD: ${{ secrets.VNC_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${VNC_PASSWORD:-}" ]; then
            echo "::error::VNC_PASSWORD secret is not set"
            exit 1
          fi

          # Legacy VNC truncates at 8 characters. Do it deliberately here so the
          # password that works is the one being derived, not a silent prefix.
          PW="$(printf '%s' "$VNC_PASSWORD" | cut -c1-8)"
          if [ "${#VNC_PASSWORD}" -gt 8 ]; then
            echo "::warning::VNC_PASSWORD is longer than 8 characters; only the first 8 are used"
          fi

          sudo /System/Library/CoreServices/RemoteManagement/ARDAgent.app/Contents/Resources/kickstart \
            -activate -configure -access -on \
            -clientopts -setvnclegacy -vnclegacy yes -setvncpw -vncpw "$PW" \
            -restart -agent -privs -all
          sudo launchctl load -w /System/Library/LaunchDaemons/com.apple.screensharing.plist 2>/dev/null || true

          echo "screen sharing enabled (legacy VNC, password auth only)"
          sudo lsof -iTCP:5900 -sTCP:LISTEN || echo "::warning::nothing listening on 5900 yet"

      - name: Join tailnet
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          args: --accept-routes=false --accept-dns=false

      - name: Connection details
        run: |
          set -euo pipefail
          echo "=================================================="
          echo " Connect with macOS Screen Sharing or any VNC client"
          echo "   address  : vnc://$(tailscale ip -4):5900"
          echo "   password : (the VNC_PASSWORD secret, first 8 chars)"
          echo "   username : none — legacy VNC is password-only"
          echo "=================================================="
          echo "Huginn is at ~/Applications/Huginn.app — double-click it."
          echo "It is a menu bar app: look top-right, no Dock icon, no window."
          echo
          echo "The speech model is already installed, so it starts at Idle"
          echo "rather than downloading. It is base.en standing in for the"
          echo "production model — same pipeline, lower accuracy."
          echo
          echo "To exercise the 'Them' track: Start Recording, then double-click"
          echo "~/Desktop/play-test-audio.command to speak through system audio,"
          echo "then Stop. Check the transcript via Open Recordings Folder."
          echo "See the 'Audio devices' step above for whether a mic exists —"
          echo "with no input device, recording stops at the microphone step."

      - name: Hold the desktop open
        run: |
          set -euo pipefail
          MINUTES="${{ github.event.inputs.minutes }}"
          if [ "$MINUTES" -gt 300 ] 2>/dev/null; then MINUTES=300; fi
          echo "Holding for $MINUTES minutes. Cancel the run when finished."
          for i in $(seq 1 "$MINUTES"); do
            printf '.'
            sleep 60
          done
          echo "time is up"
