<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Meetings</title>
<style>
/* Huginn's meeting window: the same page as Odin's meeting drawer (title, properties, Summary / Transcript /
   Meeting chat), with a tab per open meeting along the top. Notion's dark colours, as Odin uses them. */
@font-face { font-family: "Huginn UI"; src: local("Segoe UI Variable Display"), local("Segoe UI"); font-weight: 100 900; ascent-override: 101.7%; descent-override: 31.3%; }
:root {
  --bg: #191919; --surface: #252525; --panel-2: #272727;
  --border: rgba(255,255,255,.094); --border-strong: rgba(255,255,255,.16);
  --hover: rgba(255,255,255,.055); --active: rgba(255,255,255,.086);
  --text: rgba(255,255,255,.81); --text-strong: rgba(255,255,255,.92); --muted: rgba(255,255,255,.44); --faint: rgba(255,255,255,.28);
  --accent: #2383e2; --accent-line: rgba(35,131,226,.5);
  --person-me: #5e87c9; --person-1: #ba856f; --person-2: #c77d48; --person-3: #ca9849; --person-4: #529e72;
  --person-5: #4dab9a; --person-6: #9d68d3; --person-7: #d15796; --person-8: #df5452;
  --gutter: 56px;
  --font: "Huginn UI", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--surface); color: var(--text); font-family: var(--font); font-size: 15px; -webkit-font-smoothing: antialiased; }
body { display: flex; flex-direction: column; overflow: hidden; }
button { font: inherit; color: inherit; }

/* ---- meeting tabs ---- */
.mtabs { display: flex; gap: 2px; flex: 0 0 auto; padding: 8px 8px 0; background: var(--bg); border-bottom: 1px solid var(--border); overflow-x: auto; scrollbar-width: none; }
.mtab {
  display: flex; align-items: center; gap: 6px; min-width: 0; max-width: 240px; height: 34px; padding: 0 6px 0 12px;
  border: none; border-radius: 8px 8px 0 0; background: transparent; color: var(--muted); cursor: pointer; font-size: 13px;
}
.mtab:hover { background: var(--hover); color: var(--text); }
.mtab.is-on { background: var(--surface); color: var(--text-strong); box-shadow: 0 0 0 1px var(--border); clip-path: inset(-1px -1px 0 -1px); }
.mtab-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mtab-x { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 20px; height: 20px; border-radius: 4px; color: var(--faint); }
.mtab-x:hover { background: var(--active); color: var(--text); }
.mtab:focus-visible, .mn-tab:focus-visible { outline: 2px solid var(--accent-line); outline-offset: -2px; }

/* ---- the page ---- */
.page { flex: 1 1 auto; overflow-y: auto; scrollbar-gutter: stable; }
.page::-webkit-scrollbar { width: 10px; } .page::-webkit-scrollbar-thumb { background: var(--active); border-radius: 5px; }
.title { margin: 0; padding: 40px var(--gutter) 0; font-size: 30px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.25; color: var(--text-strong); text-wrap: balance; }
/* A fixed grid, so Event and Source stay in place however many attendees there are (Bohdan, 2026-11-20): the
   attendees column takes the rest of the width and wraps inside itself. */
.mn-props { display: grid; grid-template-columns: 136px minmax(0, 1fr) 112px 112px; gap: 12px 24px; padding: 12px var(--gutter) 0; }
@media (max-width: 620px) { .mn-props { grid-template-columns: 1fr 1fr; } }
.mn-people { display: flex; flex-wrap: wrap; gap: 4px 12px; }
.mn-prop { display: flex; flex-direction: column; gap: 6px; min-width: 0; max-width: 100%; }
.mn-key { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: rgba(255,255,255,.62); }
.mn-key svg { color: rgba(255,255,255,.62); }
.mn-value { font-size: 14px; font-weight: 600; color: var(--text); padding-block: 2px; }
.mn-empty { font-size: 14px; color: var(--faint); padding-block: 2px; }

.mn-person { display: inline-flex; align-items: center; gap: 6px; font-size: 14px; color: var(--text); padding-block: 2px; }
.mn-more { display: inline-flex; align-items: center; gap: 4px; padding: 2px 6px; margin-left: -6px; border: none; border-radius: 4px; background: transparent; color: var(--muted); font-size: 14px; cursor: pointer; }
.mn-more:hover { background: var(--hover); color: var(--text); }
.mn-avatar { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; width: 18px; height: 18px; padding-top: 1.5px; border-radius: 50%; background: var(--active); font-size: 9px; font-weight: 600; color: var(--muted); }
.mn-avatar.is-speaker { width: 16px; height: 16px; font-size: 8px; padding-top: 2px; }
.mn-avatar.is-coloured { background: color-mix(in srgb, var(--who) 26%, transparent); color: var(--who); }

.mn-tabs { display: flex; gap: 4px; padding: 19px var(--gutter) 0 calc(var(--gutter) - 12px); }
.mn-tab { display: inline-flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: none; border-radius: 999px; background: transparent; cursor: pointer; font-size: 14px; font-weight: 500; color: rgba(255,255,255,.62); }
.mn-tab:hover { background: var(--hover); }
.mn-tab.is-on { background: var(--hover); color: var(--text-strong); font-weight: 600; }

/* summary */
.summary { padding: 27px var(--gutter) 40px; font-size: 16px; line-height: 1.6; color: var(--text); }
.summary h1, .summary h2, .summary h3 { color: var(--text-strong); font-weight: 600; line-height: 1.3; margin: 22px 0 4px; text-wrap: balance; }
.summary > :first-child { margin-top: 0; }
.summary h1 { font-size: 22px; } .summary h2 { font-size: 20px; } .summary h3 { font-size: 17px; }
.summary p { margin: 5px 0; text-wrap: pretty; }
.summary ul, .summary ol { margin: 4px 0; padding-left: 24px; }
.summary li { padding-block: 3px; }
.summary li.task { list-style: none; margin-left: -20px; }
.summary li.task::before { content: "☐"; margin-right: 8px; color: var(--muted); }
.summary li.task.done::before { content: "☑"; }
.summary strong { color: var(--text-strong); font-weight: 600; }
.summary code { background: var(--hover); padding: 1px 5px; border-radius: 4px; font-size: .9em; }

/* transcript */
.mn-transcript { display: flex; flex-direction: column; gap: 24px; padding: 27px var(--gutter) 40px; }
.mn-block { display: flex; flex-direction: column; gap: 16px; }
.mn-speaker { display: flex; align-items: center; gap: 6px; font-size: 12px; }
.mn-speaker + .mn-chunk { margin-top: -6px; }
.mn-speaker-icon { display: inline-flex; justify-content: center; width: 16px; color: var(--muted); }
.mn-speaker-name { font-weight: 600; color: var(--muted); }
[style*="--who"] > .mn-speaker .mn-speaker-name, .mn-msg[style*="--who"] .mn-speaker-name { color: var(--who); }
.mn-time { font-size: 11px; color: var(--faint); font-variant-numeric: tabular-nums; }
.mn-speaker .mn-time { font-size: 12px; }
.mn-chunk { padding-left: 23px; }
.mn-chunk .mn-time { margin-bottom: 2px; }
.mn-text { position: relative; margin: 0; font-size: 15px; line-height: 1.6; color: var(--text); text-wrap: pretty; overflow-wrap: anywhere; }
.mn-text::before { content: ""; position: absolute; left: -16px; top: 3px; bottom: 3px; width: 2px; border-radius: 1px; background: var(--border-strong); }
.mn-block[style*="--who"] .mn-text::before { background: color-mix(in srgb, var(--who) 55%, transparent); }
.mn-events { display: flex; flex-direction: column; gap: 12px; }
.mn-event, .mn-event-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.mn-event > svg, .mn-event-line > svg { color: var(--muted); flex: 0 0 auto; margin-inline: 1px; }
.mn-event .mn-time, .mn-event-line .mn-time { font-size: 12px; }
.mn-who { font-weight: 600; color: var(--muted); }
.mn-who[style] { color: var(--who); }
.mn-whose { font-weight: 400; color: var(--muted); }
.mn-emoji { display: inline-flex; justify-content: center; width: 16px; font-size: 14px; line-height: 1; }
.mn-react { display: inline-flex; align-items: center; gap: 4px; margin-right: 6px; }
.mn-event.is-chat { flex-direction: column; align-items: stretch; gap: 6px; }
.mn-typed { margin: 0 0 0 23px; padding: 6px 10px; width: fit-content; max-width: 100%; border: 1px solid var(--border); border-radius: 6px; background: var(--hover); font-size: 14px; line-height: 1.5; color: var(--text); overflow-wrap: anywhere; }
.mn-shot { display: flex; flex-direction: column; gap: 8px; margin: 0; }
.mn-shot a, .mn-shot-missing { margin-left: 23px; max-width: calc(100% - 23px); }
.mn-shot a { display: block; width: fit-content; border-radius: 6px; }
.mn-shot img { display: block; max-width: 100%; max-height: 420px; height: auto; border: 1px solid var(--border); border-radius: 6px; background: #202020; }
.mn-shot a:hover img { border-color: var(--border-strong); }
.mn-shot-missing { display: flex; align-items: center; gap: 6px; padding: 12px; border: 1px dashed var(--border-strong); border-radius: 6px; font-size: 12px; color: var(--faint); }

/* chat */
.mn-chat { display: flex; flex-direction: column; gap: 16px; padding: 27px var(--gutter) 40px; }
.mn-msg { display: flex; flex-direction: column; gap: 4px; }
.mn-msg.is-cont { margin-top: -12px; }
.mn-msg-text { margin: 0; padding-left: 23px; font-size: 15px; line-height: 1.6; color: var(--text); overflow-wrap: anywhere; }
.mn-note { padding: 27px var(--gutter); font-size: 14px; color: var(--muted); }

/* the full-size picture */
.lightbox { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; padding: 24px; background: rgba(0,0,0,.72); cursor: zoom-out; }
.lightbox.is-on { display: flex; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 6px; box-shadow: 0 16px 40px rgba(0,0,0,.5); }

@media (max-width: 560px) { :root { --gutter: 24px; } }
@media (prefers-reduced-motion: no-preference) { .mn-tab, .mtab { transition: background-color .12s ease-out, color .12s ease-out; } }
</style>
</head>
<body>
<nav class="mtabs" id="mtabs" role="tablist" aria-label="Open meetings"></nav>
<main class="page" id="page"></main>
<div class="lightbox" id="lightbox" role="dialog" aria-label="Snapshot"><img alt=""></div>
<script>
"use strict";
// ---- icons (Odin's set) ----
const ICON = {
  clock: '<circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/>',
  users: '<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20v-.5a6.5 6.5 0 0 1 13 0v.5"/><path d="M16 4.6a3.5 3.5 0 0 1 0 6.8M18.5 14.2a6.5 6.5 0 0 1 3 5.3v.5"/>',
  calendar: '<rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M8 3v4M16 3v4"/>',
  video: '<rect x="2.5" y="6" width="13" height="12" rx="2"/><path d="m15.5 10.5 6-3.5v10l-6-3.5"/>',
  summary: '<path d="m3 6 1.6 1.6L7.5 4.7M3 13l1.6 1.6 2.9-2.9"/><path d="M11 6h10M11 13h10M4 19.5h17"/>',
  transcript: '<path d="M3 5h11M3 10h9M3 15h6"/><rect x="15.5" y="3" width="5" height="10" rx="2.5"/><path d="M13 11a5 5 0 0 0 10 0M18 16v4.5M15.5 20.5h5"/>',
  chat: '<path d="M4.5 4.5h15a1.5 1.5 0 0 1 1.5 1.5v9.5a1.5 1.5 0 0 1-1.5 1.5H10l-4.5 3.5V17H4.5A1.5 1.5 0 0 1 3 15.5V6a1.5 1.5 0 0 1 1.5-1.5z"/>',
  wave: '<path d="M3 10v4M7 7v10M11 4v16M15 8v8M19 10.5v3"/>',
  screen: '<rect x="3" y="4" width="18" height="12.5" rx="1.5"/><path d="M8.5 20.5h7M12 16.5v4"/>',
  image: '<rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="1.8"/><path d="m21 16-5-5-9 9"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  right: '<path d="m9 6 6 6-6 6"/>', down: '<path d="m6 9 6 6 6-6"/>',
};
const icon = (n, size = 14, stroke = 1.8) =>
  `<svg width="${size}" height="${size}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${stroke}" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICON[n]}</svg>`;
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

// ---- transcript parsing (the same rules as Odin's MeetingNote.tsx) ----
const STAMP = /^\[(\d{1,2}):(\d{2}):(\d{2})\]\s*/;
const LINE = /^\[(\d{1,2}):(\d{2}):(\d{2})\]\s*([^:*][^:]*?):\s?(.*)$/;
const EVENT = /^\[(\d{1,2}):(\d{2}):(\d{2})\]\s*\*\s*(.+)$/;
const secs = (m) => +m[1] * 3600 + +m[2] * 60 + +m[3];
function parseEvent(at, s) {
  let m;
  if ((m = s.match(/^Snapshot of (.+?)'s screen: (shot-\d+\.jpg)$/))) return { kind: "shot", at, who: m[1], what: m[2] };
  if ((m = s.match(/^(.+?) typed: "(.*)"$/))) return { kind: "chat", at, who: m[1], what: m[2] };
  if ((m = s.match(/^(.+?) reacted (.+)$/))) return { kind: "react", at, who: m[1], what: m[2] };
  if ((m = s.match(/^(.+?) (raised|lowered) a hand$/))) return { kind: m[2] === "raised" ? "hand-up" : "hand-down", at, who: m[1], what: "" };
  if ((m = s.match(/^(.+?) (started|stopped) sharing their screen$/))) return { kind: m[2] === "started" ? "share-start" : "share-stop", at, who: m[1], what: "" };
  return { kind: "other", at, who: "", what: s };
}
function parseTranscript(raw) {
  let start = null, source = null, me = null, room = null, withPeople = [];
  const rows = [];
  for (const l of raw.replace(/\r\n/g, "\n").split("\n")) {
    if (l.startsWith("#")) {
      const t = l.match(/^# Meeting transcript\s*[—-]\s*(\d{4})-(\d{2})-(\d{2})\s+(\d{1,2}):(\d{2})/);
      if (t) start = new Date(+t[1], +t[2] - 1, +t[3], +t[4], +t[5]);
      const s = l.match(/^# Source:\s*(.+)$/); if (s) source = s[1].trim();
      const k = l.match(/^# Kumospace:\s*(.+?)\s*·\s*with\s*(.+)$/);
      if (k) { if (!source) source = "Kumospace"; room = k[1]; if (k[2] !== "nobody recorded") withPeople = k[2].split(/,\s*/); }
      const sp = l.match(/^# Speakers: Me = ([^.]+(?:\.[A-Z][^.\s]*)?)\./);
      if (sp && sp[1] !== "the microphone") me = sp[1].replace(/\./g, " ");
      continue;
    }
    if (!STAMP.test(l)) continue;
    const e = l.match(EVENT);
    if (e) { rows.push(parseEvent(secs(e), e[4].trim())); continue; }
    const m = l.match(LINE);
    if (m) rows.push({ at: secs(m), speaker: m[4].trim(), text: m[5].trim() });
  }
  const name = (s) => (s === "Me" ? me ?? "Me" : s === "Them" ? "System audio" : s);
  const items = [], chat = [], people = new Set();
  let prev = null;
  for (const r of rows) {
    if (r.kind) {
      if (r.kind === "chat") chat.push(r);
      if (r.who) people.add(r.who);
      const last = items[items.length - 1];
      if (last && last.kind === "event") last.events.push(r); else items.push({ kind: "event", events: [r] });
      prev = null;
      continue;
    }
    if (!r.text) continue;
    const speaker = name(r.speaker);
    if (speaker !== "System audio") people.add(speaker.split(" / ")[0]);
    let block = items[items.length - 1];
    if (!block || block.kind !== "speech" || block.speaker !== speaker) { block = { kind: "speech", speaker, chunks: [] }; items.push(block); prev = null; }
    const chunk = block.chunks[block.chunks.length - 1];
    if (chunk && prev && r.at - prev.at < 15 && r.at - chunk.at < 60) chunk.text += " " + r.text;
    else block.chunks.push({ at: r.at, text: r.text });
    prev = r;
  }
  return { start, source, me, room, withPeople, items, chat, people: [...people] };
}
function clock(start, at) {
  if (!start) { const h = Math.floor(at / 3600), m = Math.floor((at % 3600) / 60), s = at % 60; return h ? `${h}:${String(m).padStart(2, "0")}:${String(s).padStart(2, "0")}` : `${m}:${String(s).padStart(2, "0")}`; }
  return new Date(start.getTime() + at * 1000).toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit", second: "2-digit" });
}
const initials = (n) => { const p = n.split(/\s+/).filter(Boolean); return ((p[0]?.[0] ?? "") + (p.length > 1 ? p[p.length - 1][0] : "")).toUpperCase(); };

// ---- a colour per person, from the name alone (the same rule as Odin) ----
function nameHash(name) { let h = 0x811c9dc5; for (const ch of name.trim().toLowerCase()) { h ^= ch.codePointAt(0); h = Math.imul(h, 0x01000193) >>> 0; } return h; }
function personColours(names, me) {
  const out = new Map(), taken = new Set();
  if (me) out.set(me, "var(--person-me)");
  const others = [...new Set(names.map((n) => n.trim()).filter((n) => n && n !== me && n !== "System audio"))].sort((a, b) => a.localeCompare(b));
  for (const n of others) { let slot = nameHash(n) % 8; for (let i = 0; i < 8 && taken.has(slot); i++) slot = (slot + 1) % 8; taken.add(slot); out.set(n, `var(--person-${slot + 1})`); }
  return out;
}

// ---- a small markdown renderer for the summary (headings, lists, tasks, bold, italic, code, links) ----
function inline(s) {
  return esc(s)
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\s][^*]*)\*/g, "$1<em>$2</em>")
    .replace(/\[\[([^\]|]+)(?:\|([^\]]+))?\]\]/g, (_, a, b) => b || a)
    .replace(/\[([^\]]+)\]\([^)]+\)/g, "$1");
}
function markdown(md) {
  const out = []; let list = null;
  const close = () => { if (list) { out.push(`</${list}>`); list = null; } };
  for (const raw of md.replace(/\r\n/g, "\n").split("\n")) {
    const l = raw.trimEnd();
    let m;
    if (!l.trim()) { close(); continue; }
    if ((m = l.match(/^(#{1,3})\s+(.*)$/))) { close(); out.push(`<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+\[( |x|X)\]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li class="task${m[1].trim() ? " done" : ""}">${inline(m[2])}</li>`); continue; }
    if ((m = l.match(/^\s*[-*]\s+(.*)$/))) { if (list !== "ul") { close(); out.push("<ul>"); list = "ul"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    if ((m = l.match(/^\s*\d+[.)]\s+(.*)$/))) { if (list !== "ol") { close(); out.push("<ol>"); list = "ol"; } out.push(`<li>${inline(m[1])}</li>`); continue; }
    close(); out.push(`<p>${inline(l)}</p>`);
  }
  close();
  return out.join("");
}
// The note body without its "## Transcript" section: the Transcript tab replaces it.
const stripTranscriptSection = (body) => body.replace(/\n#{1,3}\s*Transcript\s*\n[\s\S]*$/, "\n");

// ---- state ----
const meetings = [];   // { id, title, date, source, attendees, event, summary, transcript, shotPrefix, tab, parsed, colours, open }
let active = null;

window.huginnOpen = (json) => {
  const m = typeof json === "string" ? JSON.parse(json) : json;
  let cur = meetings.find((x) => x.id === m.id);
  if (cur) Object.assign(cur, m, { parsed: null });
  else { cur = { ...m, tab: "transcript", open: false }; meetings.push(cur); } // a meeting opens on its transcript (Bohdan, 2026-11-20)
  active = cur.id;
  render();
};

function closeMeeting(id) {
  const i = meetings.findIndex((x) => x.id === id);
  if (i < 0) return;
  meetings.splice(i, 1);
  if (!meetings.length) { window.chrome?.webview?.postMessage("close"); return; }
  if (active === id) active = meetings[Math.max(0, i - 1)].id;
  render();
}

function avatar(name, colours, small) {
  const c = colours.get(name.split(" / ")[0].trim());
  return `<span class="mn-avatar${small ? " is-speaker" : ""}${c ? " is-coloured" : ""}"${c ? ` style="--who:${c}"` : ""} aria-hidden="true">${esc(initials(name))}</span>`;
}
const whoStyle = (colours, n) => { const c = colours.get((n || "").split(" / ")[0].trim()); return c ? ` style="--who:${c}"` : ""; };

function render() {
  document.getElementById("mtabs").innerHTML = meetings.map((m) =>
    `<button class="mtab${m.id === active ? " is-on" : ""}" role="tab" aria-selected="${m.id === active}" data-id="${esc(m.id)}" title="${esc(m.title)}">
       <span class="mtab-name">${esc(m.title)}</span>
       <span class="mtab-x" data-close="${esc(m.id)}" role="button" aria-label="Close ${esc(m.title)}">${icon("close", 12, 2)}</span>
     </button>`).join("");
  const m = meetings.find((x) => x.id === active);
  const page = document.getElementById("page");
  if (!m) { page.innerHTML = ""; return; }
  document.title = m.title;
  if (!m.parsed) {
    m.parsed = parseTranscript(m.transcript || "");
    const attendees = m.attendees?.length ? m.attendees : [...new Set([...(m.parsed.me ? [m.parsed.me] : []), ...m.parsed.withPeople])];
    m.attendeesShown = attendees;
    m.colours = personColours([...attendees, ...m.parsed.people], m.parsed.me);
  }
  const t = m.parsed, colours = m.colours;
  const people = m.attendeesShown;
  const hidden = people.length - 3, shown = m.open || hidden <= 0 ? people : people.slice(0, 3);
  const date = m.date ? new Date(m.date + "T00:00:00").toLocaleDateString("en-US", { month: "long", day: "numeric", year: "numeric" }) : "";
  const tabs = [
    ...(m.summary ? [["summary", "Summary", "summary"]] : []),
    ["transcript", "Transcript", "transcript"],
    ["chat", "Meeting chat", "chat"],
  ];
  page.innerHTML = `
    <h1 class="title">${esc(m.title)}</h1>
    <div class="mn-props">
      <div class="mn-prop"><div class="mn-key">${icon("clock")}Date</div>${date ? `<span class="mn-value" style="font-weight:400">${esc(date)}</span>` : `<span class="mn-empty">Empty</span>`}</div>
      <div class="mn-prop"><div class="mn-key">${icon("users")}Attendees</div>${people.length ? `<div class="mn-people">${shown.map((a) => `<span class="mn-person">${avatar(a, colours)}${esc(a)}</span>`).join("")}${hidden > 0 ? `<button class="mn-more" id="more" aria-expanded="${!!m.open}">${icon(m.open ? "down" : "right", 13, 2)}${m.open ? "Show less" : `${hidden} more`}</button>` : ""}</div>` : `<span class="mn-empty">Empty</span>`}</div>
      <div class="mn-prop"><div class="mn-key">${icon("calendar")}Event</div>${m.event ? `<span class="mn-value" style="font-weight:400">${esc(m.event)}</span>` : `<span class="mn-empty">Empty</span>`}</div>
      <div class="mn-prop"><div class="mn-key">${icon("video")}Source</div>${(m.source || t.source) ? `<span class="mn-value">${esc(m.source || t.source)}</span>` : `<span class="mn-empty">Empty</span>`}</div>
    </div>
    <div class="mn-tabs" role="tablist">${tabs.map(([k, label, ic]) => `<button class="mn-tab${m.tab === k ? " is-on" : ""}" role="tab" aria-selected="${m.tab === k}" data-tab="${k}">${icon(ic, 16, 1.7)}${label}</button>`).join("")}</div>
    ${m.tab === "summary" ? `<div class="summary">${markdown(stripTranscriptSection(m.summary || ""))}</div>`
      : m.tab === "chat" ? chatView(t, colours)
      : transcriptView(t, colours, m.shotPrefix)}`;
}

function transcriptView(t, colours, shotPrefix) {
  if (!t.items.length) return `<div class="mn-note">No speech in this transcript.</div>`;
  return `<div class="mn-transcript">${t.items.map((b) => b.kind === "event" ? eventGroup(b.events, t.start, colours, shotPrefix) : `
    <section class="mn-block"${whoStyle(colours, b.speaker)}>
      <div class="mn-speaker">${b.speaker === "System audio" ? `<span class="mn-speaker-icon">${icon("wave", 14, 2)}</span>` : avatar(b.speaker, colours, true)}
        <span class="mn-speaker-name">${esc(b.speaker)}</span><span class="mn-time">${clock(t.start, b.chunks[0].at)}</span></div>
      ${b.chunks.map((c, j) => `<div class="mn-chunk">${j > 0 ? `<div class="mn-time">${clock(t.start, c.at)}</div>` : ""}<p class="mn-text">${esc(c.text)}</p></div>`).join("")}
    </section>`).join("")}</div>`;
}

function eventGroup(events, start, colours, shotPrefix) {
  const rows = [];
  for (const e of events) { const last = rows[rows.length - 1]; if (e.kind === "react" && Array.isArray(last)) last.push(e); else rows.push(e.kind === "react" ? [e] : e); }
  const who = (e) => `<span class="mn-who"${whoStyle(colours, e.who)}>${esc(e.who)}</span>`;
  const time = (e) => `<span class="mn-time">${clock(start, e.at)}</span>`;
  return `<div class="mn-events">${rows.map((r) => {
    if (Array.isArray(r)) return `<div class="mn-event">${r.map((e) => `<span class="mn-react"><span class="mn-emoji" aria-hidden="true">${esc(e.what)}</span>${who(e)}</span>`).join("")}${time(r[0])}</div>`;
    const e = r;
    switch (e.kind) {
      case "shot": {
        const src = shotPrefix + e.what;
        return `<figure class="mn-shot"><figcaption class="mn-event-line">${icon("image")}<span class="mn-who"${whoStyle(colours, e.who)}>${esc(e.who)}<span class="mn-whose">'s screen</span></span>${time(e)}</figcaption>
          <a href="${esc(src)}" data-shot="${esc(src)}" aria-label="Open the snapshot full size"><img src="${esc(src)}" alt="" loading="lazy" onerror="this.closest('a').outerHTML='<div class=&quot;mn-shot-missing&quot;>Snapshot not available</div>'"></a></figure>`;
      }
      case "chat": return `<div class="mn-event is-chat"><div class="mn-event-line">${icon("chat")}${who(e)}<span>typed</span>${time(e)}</div><p class="mn-typed">${esc(e.what)}</p></div>`;
      case "hand-up": case "hand-down": return `<div class="mn-event"><span class="mn-emoji" aria-hidden="true">✋</span>${who(e)}<span>${e.kind === "hand-up" ? "raised a hand" : "lowered a hand"}</span>${time(e)}</div>`;
      case "share-start": case "share-stop": return `<div class="mn-event">${icon("screen")}${who(e)}<span>${e.kind === "share-start" ? "started sharing their screen" : "stopped sharing their screen"}</span>${time(e)}</div>`;
      default: return `<div class="mn-event"><span>${esc(e.what)}</span>${time(e)}</div>`;
    }
  }).join("")}</div>`;
}

function chatView(t, colours) {
  if (!t.chat.length) return `<div class="mn-note">Nobody typed in the meeting chat.</div>`;
  return `<div class="mn-chat">${t.chat.map((m, i) => {
    const same = i > 0 && t.chat[i - 1].who === m.who && m.at - t.chat[i - 1].at < 120;
    return `<div class="mn-msg${same ? " is-cont" : ""}"${whoStyle(colours, m.who)}>${same ? "" : `<div class="mn-speaker">${avatar(m.who, colours, true)}<span class="mn-speaker-name">${esc(m.who)}</span><span class="mn-time">${clock(t.start, m.at)}</span></div>`}<p class="mn-msg-text">${esc(m.what)}</p></div>`;
  }).join("")}</div>`;
}

// ---- clicks ----
document.addEventListener("click", (ev) => {
  const x = ev.target.closest("[data-close]");
  if (x) { ev.stopPropagation(); closeMeeting(x.dataset.close); return; }
  const tab = ev.target.closest(".mtab");
  if (tab) { active = tab.dataset.id; render(); document.getElementById("page").scrollTop = 0; return; }
  const mt = ev.target.closest("[data-tab]");
  if (mt) { const m = meetings.find((y) => y.id === active); m.tab = mt.dataset.tab; render(); return; }
  if (ev.target.closest("#more")) { const m = meetings.find((y) => y.id === active); m.open = !m.open; render(); return; }
  const shot = ev.target.closest("[data-shot]");
  if (shot) { ev.preventDefault(); const lb = document.getElementById("lightbox"); lb.querySelector("img").src = shot.dataset.shot; lb.classList.add("is-on"); return; }
  if (ev.target.closest("#lightbox")) document.getElementById("lightbox").classList.remove("is-on");
});
document.addEventListener("auxclick", (ev) => { const tab = ev.target.closest(".mtab"); if (tab && ev.button === 1) closeMeeting(tab.dataset.id); });
document.addEventListener("keydown", (ev) => {
  if (ev.key === "Escape") document.getElementById("lightbox").classList.remove("is-on");
  if ((ev.ctrlKey || ev.metaKey) && ev.key.toLowerCase() === "w" && active) { ev.preventDefault(); closeMeeting(active); }
});
window.chrome?.webview?.postMessage("ready");
</script>
</body>
</html>
