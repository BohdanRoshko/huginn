name: Build Huginn

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  # Pinned, not tracking main: an unpinned clone makes the build
  # irreproducible and can break on an upstream commit that has nothing to do
  # with us. Bump deliberately.
  WHISPER_TAG: v1.9.2

jobs:
  build:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          sw_vers
          swift --version
          cmake --version

      # The whisper build is by far the slowest step and only changes when the
      # pinned tag does, so cache it — otherwise every Swift compile fix pays
      # for a full rebuild.
      - name: Restore cached whisper-cli
        id: whisper-cache
        uses: actions/cache@v4
        with:
          path: prebuilt/whisper-cli
          key: whisper-cli-${{ env.WHISPER_TAG }}-arm64-metal-v1

      # whisper.cpp is built here rather than pulled from Homebrew so Metal is
      # compiled in with the shader library EMBEDDED. The Homebrew formula
      # leaves Metal off unless GGML_METAL_PATH_RESOURCES points at its share
      # directory, which cannot be relied on inside an app bundle — and without
      # Metal an M-series Mac transcribes roughly 5x slower.
      - name: Build whisper.cpp (arm64, Metal embedded)
        if: steps.whisper-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          git clone --depth 1 --branch "$WHISPER_TAG" \
            https://github.com/ggml-org/whisper.cpp.git whisper-src
          cd whisper-src
          # arm64 only: the target machine is Apple Silicon. GGML_NATIVE stays
          # OFF so the binary is a baseline arm64 build rather than tuned to
          # whichever M-series chip the runner happens to be. It does not
          # affect Metal, which is GPU-side.
          cmake -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_OSX_ARCHITECTURES="arm64" \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=13.0 \
            -DGGML_METAL=ON \
            -DGGML_METAL_EMBED_LIBRARY=ON \
            -DGGML_NATIVE=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DWHISPER_BUILD_TESTS=OFF \
            -DWHISPER_BUILD_EXAMPLES=ON \
            -DWHISPER_BUILD_SERVER=OFF

          # Metal is a hard requirement, not a nice-to-have: without it an
          # M-series Mac transcribes ~5x slower. Fail loudly here rather than
          # shipping a silently CPU-only binary.
          for flag in GGML_METAL GGML_METAL_EMBED_LIBRARY; do
            if ! grep -q "^${flag}:BOOL=ON$" build/CMakeCache.txt; then
              echo "::error::${flag} did not stick — refusing to ship a non-Metal build"
              grep -i metal build/CMakeCache.txt || true
              exit 1
            fi
          done

          cmake --build build --config Release -j"$(sysctl -n hw.ncpu)"

          # Binary name moved from `main` to `whisper-cli` upstream; accept either.
          BIN=""
          for candidate in build/bin/whisper-cli build/bin/main; do
            if [ -f "$candidate" ]; then BIN="$candidate"; break; fi
          done
          if [ -z "$BIN" ]; then
            echo "::error::whisper-cli was not produced"
            find build -maxdepth 3 -type f -perm +111 || true
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/prebuilt"
          cp "$BIN" "$GITHUB_WORKSPACE/prebuilt/whisper-cli"

      # Runs on the cached path too, so a stale or truncated cache entry is
      # caught here rather than shipped inside the app.
      - name: Verify whisper-cli
        run: |
          set -euo pipefail
          test -f prebuilt/whisper-cli || { echo "::error::whisper-cli missing"; exit 1; }
          chmod +x prebuilt/whisper-cli
          lipo -info prebuilt/whisper-cli
          lipo -info prebuilt/whisper-cli | grep -q arm64 \
            || { echo "::error::whisper-cli is not arm64"; exit 1; }

      # The de-echo logic is pure text in / text out, so unlike the audio path
      # it can be verified without a Mac in hand. Expected values come from the
      # original C# implementation, making this the guard on the port.
      - name: Test HuginnCore
        run: swift test --filter HuginnCoreTests

      - name: Build Huginn (arm64)
        run: |
          set -euo pipefail
          # No --arch flag: the runner is Apple Silicon, so a plain build is
          # already arm64, and --show-bin-path avoids guessing the layout
          # (SwiftPM puts multi-arch and single-arch output in different trees).
          swift build -c release
          swift build -c release --show-bin-path > .binpath
          lipo -info "$(cat .binpath)/Huginn"

      - name: Assemble Huginn.app
        run: |
          set -euo pipefail
          APP="Huginn.app"
          rm -rf "$APP"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"

          cp "$(cat .binpath)/Huginn" "$APP/Contents/MacOS/Huginn"
          cp prebuilt/whisper-cli "$APP/Contents/Resources/whisper-cli"
          cp Resources/Info.plist "$APP/Contents/Info.plist"
          chmod +x "$APP/Contents/MacOS/Huginn" "$APP/Contents/Resources/whisper-cli"
          printf 'APPL????' > "$APP/Contents/PkgInfo"

      # Ad-hoc signing is free and is all that is needed: Apple Silicon refuses
      # to run an unsigned binary at all, while Gatekeeper's "unidentified
      # developer" prompt is handled once on the user's side (see README).
      # Hardened runtime is deliberately NOT enabled — it would require a real
      # Developer ID to pair with entitlements for the microphone.
      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          codesign --force --sign - --timestamp=none Huginn.app/Contents/Resources/whisper-cli
          codesign --force --sign - --timestamp=none Huginn.app/Contents/MacOS/Huginn
          codesign --force --sign - --timestamp=none Huginn.app
          codesign --verify --deep --strict --verbose=2 Huginn.app

      # The runner is a real Apple Silicon Mac, so the transcription half can be
      # exercised for real rather than assumed. macOS ships `say`, so we can
      # synthesise known speech, push it through the SHIPPED binary, and check
      # the words come back. This is what proves the JSON contract in
      # Transcriber.swift is right — if the shape is wrong, every transcript in
      # the app comes back silently empty.
      #
      # Uses base.en (142MB) rather than the app's large-v3-turbo (1.6GB): the
      # CLI flags, JSON shape and Metal path are identical, and the smaller
      # model keeps the job fast.
      - name: Verify transcription end-to-end
        run: |
          set -euo pipefail
          WHISPER="Huginn.app/Contents/Resources/whisper-cli"

          say -o /tmp/probe.aiff "The quarterly inventory report is ready for review."
          afconvert -f WAVE -d LEI16@16000 /tmp/probe.aiff /tmp/probe.wav
          afinfo /tmp/probe.wav | head -5

          curl -sSL --fail -o /tmp/ggml-base.en.bin \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          ls -lh /tmp/ggml-base.en.bin

          # Keep whisper's own prints: the backend banner tells us whether
          # Metal actually engaged on this hardware.
          "$WHISPER" -m /tmp/ggml-base.en.bin -f /tmp/probe.wav \
            -l en -oj -of /tmp/probe 2>&1 | tee /tmp/whisper.out

          echo "--- backend ---"
          grep -iE "metal|gpu|backend" /tmp/whisper.out || echo "(no backend line found)"

          echo "--- raw json ---"
          cat /tmp/probe.json

          # Assert exactly what Sources/Huginn/Transcriber.swift decodes.
          python3 - <<'PY'
          import json, sys
          with open('/tmp/probe.json') as fh:
              doc = json.load(fh)

          segments = doc.get('transcription')
          assert segments, 'no "transcription" array — Transcriber.swift would decode nothing'

          for seg in segments:
              assert 'text' in seg, f'segment missing "text": {seg}'
              offsets = seg.get('offsets')
              assert offsets is not None, f'segment missing "offsets": {seg}'
              for key in ('from', 'to'):
                  assert key in offsets, f'offsets missing "{key}": {offsets}'
                  assert isinstance(offsets[key], int), \
                      f'offsets.{key} is {type(offsets[key]).__name__}, Swift decodes Int'

          text = ' '.join(s['text'] for s in segments).lower()
          print('TRANSCRIBED:', text.strip())

          missing = [w for w in ('quarterly', 'inventory', 'report') if w not in text]
          assert not missing, f'transcription lost expected words: {missing}'
          print('OK - JSON contract matches Transcriber.swift, and the words came back')
          PY

      # There is no Mac on the authoring side, so this is the only way to see
      # what the app actually looks like before a user does. The runner has a
      # real window server, so the app can be launched, its menu opened, and the
      # screen photographed.
      #
      # Best-effort: if the runner image ever stops providing a GUI session this
      # should not fail the build, since it proves appearance, not correctness.
      - name: Screenshot the UI
        continue-on-error: true
        run: |
          set -uo pipefail
          SUPPORT="$HOME/Library/Application Support/Huginn"
          mkdir -p "$SUPPORT/Models" "$SUPPORT/Recordings" shots

          # A placeholder model file makes the downloader report "ready", so the
          # menu renders in its normal idle state instead of first-run
          # "downloading". Nothing reads it — the app is never asked to transcribe.
          touch "$SUPPORT/Models/ggml-large-v3-turbo.bin"

          # Two finished meetings so the Recent section renders as it would in use.
          cat > "$SUPPORT/recent.json" <<'JSON'
          [
            {"id":"6B29FC40-CA47-1067-B31D-00DD010662DA","startedAt":"2026-08-05T09:15:00Z","status":"done","transcriptPath":"/tmp/a_transcript.txt"},
            {"id":"6B29FC40-CA47-1067-B31D-00DD010662DB","startedAt":"2026-08-04T14:02:00Z","status":"done","transcriptPath":"/tmp/b_transcript.txt"}
          ]
          JSON

          HUGINN_UI_PROBE=1 open -a "$PWD/Huginn.app" || open "$PWD/Huginn.app"
          sleep 8
          screencapture -x shots/idle.png || echo "screencapture failed (idle)"
          pkill -x Huginn || true
          sleep 2

          # Second pass in the RECORDING state: the menu bar clock only exists
          # while recording, so an idle shot cannot show whether it renders.
          # Launched DIRECTLY, not via `open`: an app started by `open` gets its
          # own TCC identity and blocks on the microphone consent dialog, which
          # is what the first attempt photographed instead of the clock. Running
          # the binary inherits the runner shell's already-granted context, the
          # same way the self-test does.
          HUGINN_UI_PROBE=recording ./Huginn.app/Contents/MacOS/Huginn >/tmp/uiprobe.log 2>&1 &
          sleep 14
          screencapture -x shots/recording.png || echo "screencapture failed (recording)"
          pkill -x Huginn || true

          for f in shots/*.png; do
            [ -f "$f" ] && sips -g pixelWidth -g pixelHeight "$f"
          done
          ls -la shots/

      - name: Upload screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Huginn-screenshots
          path: shots/
          if-no-files-found: warn

      # Live capture is the ONE thing no other check can reach: it needs
      # permissions a user grants interactively and audio hardware a runner may
      # not have. This drives the real path and reports what happened.
      #
      # continue-on-error by design. A permission refusal here is INFORMATION,
      # not a defect — it would mean only a real user can exercise this, which
      # is worth knowing but must not block shipping.
      - name: Probe live audio capture
        continue-on-error: true
        timeout-minutes: 8
        run: |
          set -uo pipefail
          SUPPORT="$HOME/Library/Application Support/Huginn"
          mkdir -p "$SUPPORT/Models" "$SUPPORT/Recordings"

          # base.en under the production filename: whisper loads by content, and
          # this keeps the probe off a 1.6GB download.
          if [ ! -s "$SUPPORT/Models/ggml-large-v3-turbo.bin" ]; then
            curl -sSL --fail -o /tmp/base.en.bin \
              https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
            cp /tmp/base.en.bin "$SUPPORT/Models/ggml-large-v3-turbo.bin"
          fi

          set +e
          HUGINN_SELFTEST=1 ./Huginn.app/Contents/MacOS/Huginn 2>&1 | tee /tmp/selftest.log
          STATUS=${PIPESTATUS[0]}
          set -e

          echo "=================================================="
          case "$STATUS" in
            0) echo "CAPTURE WORKS on this runner — audio recorded and transcribed" ;;
            2) echo "Recording could not START. If permissions were refused, that is"
               echo "expected in CI and means only a real user can verify capture." ;;
            5) echo "Capture ran but both tracks were SILENT — no usable audio hardware." ;;
            *) echo "Self-test exited $STATUS — see the log above." ;;
          esac
          echo "=================================================="

          grep -E "them track|me   track|authorization" /tmp/selftest.log || true
          exit 0

      - name: Package
        run: |
          set -euo pipefail
          # ditto preserves the bundle structure and the executable bits, which
          # a plain `zip` (and GitHub's own artifact zipping) does not.
          ditto -c -k --keepParent Huginn.app Huginn.zip
          ls -lh Huginn.zip

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: Huginn-macOS
          path: Huginn.zip
          if-no-files-found: error
