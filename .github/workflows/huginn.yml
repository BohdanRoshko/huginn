name: Huginn

# One shared C# core, two shells. A push tests the core and builds Windows only. The Mac app (the macOS runner is the
# only place it is compiled, run and photographed) and the release are built only when started by hand
# ("Run workflow", or: gh workflow run huginn.yml): Bohdan's call during active development, 2026-11-18.

on:
  push:
    branches: [main]
    paths: ['core/**', 'mac/**', 'windows/**', 'tests/**', 'Huginn.sln', '.github/workflows/huginn.yml']
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Test the core
        run: dotnet test tests/Huginn.Core.Tests -c Release
      - name: Build the Windows app
        run: dotnet build windows/Huginn.csproj -c Release

      # Framework-dependent (needs the .NET 10 Desktop Runtime): a self-contained publish flattens the cleanup LLM's
      # per-CPU native folders into one and fails. Other systems' native libraries are dropped to keep the zip small.
      - name: Package the Windows app
        shell: pwsh
        run: |
          dotnet publish windows/Huginn.csproj -c Release --self-contained false -o publish/Huginn
          $rt = 'publish/Huginn/runtimes'
          Get-ChildItem $rt -Directory | Where-Object { $_.Name -notin 'win-x64', 'vulkan' } | Remove-Item -Recurse -Force
          Get-ChildItem "$rt/vulkan" -Directory | Where-Object { $_.Name -ne 'win-x64' } | Remove-Item -Recurse -Force
          Get-ChildItem publish/Huginn -Filter *.metal | Remove-Item -Force
          Compress-Archive -Path publish/Huginn -DestinationPath Huginn-Windows-x64.zip
          "{0:N1} MB" -f ((Get-Item Huginn-Windows-x64.zip).Length / 1MB)

      - uses: actions/upload-artifact@v4
        with:
          name: Huginn-Windows-x64
          path: Huginn-Windows-x64.zip
          if-no-files-found: error

  mac:
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install the macOS workload
        run: dotnet workload install macos

      # Each macOS SDK pack accepts only the Xcode it was built against. The project pins its pack version
      # (net10.0-macos26.0), so select that Xcode.
      - name: Pick the Xcode the workload wants
        run: |
          set -euo pipefail
          ls -d /Applications/Xcode*.app
          ls -d "$HOME"/.dotnet/packs/Microsoft.macOS.Sdk.net10.0_*
          V=$(grep -o 'net10.0-macos[0-9.]*' mac/Huginn.Mac.csproj | head -1 | sed 's/net10.0-macos//')
          echo "workload wants Xcode $V"
          X=$(ls -d /Applications/Xcode_"$V".app /Applications/Xcode_"$V".*.app 2>/dev/null | grep -v beta | sort -V | tail -1 || true)
          test -n "$X" || { echo "::error::no Xcode $V on this runner"; exit 1; }
          sudo xcode-select -s "$X"
          xcodebuild -version

      - name: Test the core
        run: dotnet test tests/Huginn.Core.Tests -c Release

      - name: Show the SDK's dlsym switches
        continue-on-error: true
        run: grep -rn -B2 -A2 "Dlsym" "$HOME"/.dotnet/packs/Microsoft.macOS.Sdk.net10.0_26.0/*/targets | sed 's#^.*/targets/##' | cut -c1-220

      - name: Build the Mac app
        run: |
          if ! dotnet build mac/Huginn.Mac.csproj -c Release -v:n > "$RUNNER_TEMP/build.log" 2>&1; then
            echo "--- errors ---"
            grep -E "error|Undefined symbols|referenced from" "$RUNNER_TEMP/build.log" | grep -v "initial-undefines" | sort -u | cut -c1-400 | head -60 || true
            echo "--- last lines ---"
            tail -40 "$RUNNER_TEMP/build.log" | cut -c1-400 || true
            exit 1
          fi
          grep -E "warning|Whisper natives" "$RUNNER_TEMP/build.log" | sort -u | cut -c1-300 | head -40 || true

      - name: Find the bundle
        run: |
          set -euo pipefail
          APP=$(find mac/bin/Release -maxdepth 4 -name Huginn.app -type d | head -1)
          test -n "$APP" || { echo "::error::Huginn.app was not produced"; exit 1; }
          echo "APP=$APP" >> "$GITHUB_ENV"
          echo "--- native libraries in the bundle ---"
          find "$APP" \( -name "*.dylib" -o -name "*.metal" \) | sed "s#^$APP/##"
          /usr/libexec/PlistBuddy -c "Print" "$APP/Contents/Info.plist"

      # Ad hoc is free and enough: Apple Silicon refuses an unsigned binary, and Gatekeeper's prompt is handled once
      # on the user's side (README). No hardened runtime: that needs a Developer ID.
      - name: Ad-hoc sign
        run: |
          set -euo pipefail
          codesign --force --deep --sign - --timestamp=none "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"

      # The runner is a real Apple Silicon Mac: push known speech through the SHIPPED app, dictation and the whole
      # meeting pipeline. base.en sits under the production file name to keep the download small.
      - name: Self-test transcription
        timeout-minutes: 15
        run: |
          set -euo pipefail
          export HUGINN_DATA_DIR="$RUNNER_TEMP/huginn-data"
          mkdir -p "$HUGINN_DATA_DIR"
          curl -sSL --fail -o "$HUGINN_DATA_DIR/ggml-large-v3-turbo.bin" \
            https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-base.en.bin
          say -o "$RUNNER_TEMP/probe.aiff" "The quarterly inventory report is ready for review."
          afconvert -f WAVE -d LEI16@16000 "$RUNNER_TEMP/probe.aiff" "$RUNNER_TEMP/probe.wav"
          HUGINN_SELFTEST=transcribe HUGINN_SELFTEST_WAV="$RUNNER_TEMP/probe.wav" \
            HUGINN_SELFTEST_EXPECT=quarterly,inventory,report \
            "$APP/Contents/MacOS/Huginn"
          echo "--- huginn.log ---"
          cat "$HUGINN_DATA_DIR/huginn.log" || true

      - name: Photograph the windows
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set -uo pipefail
          export HUGINN_DATA_DIR="$RUNNER_TEMP/huginn-ui"
          mkdir -p "$HUGINN_DATA_DIR" shots
          cp "$RUNNER_TEMP/huginn-data/ggml-large-v3-turbo.bin" "$HUGINN_DATA_DIR/" || true
          # The menu bar menu, as a user first sees the app (it is a menu bar app; the panel is off by default).
          HUGINN_UI_PROBE=menu "$APP/Contents/MacOS/Huginn" > "$RUNNER_TEMP/ui.log" 2>&1 &
          sleep 10
          screencapture -x shots/menu.png || echo "screencapture failed (menu)"
          pkill -x Huginn || true
          sleep 2
          # The meeting pop-up a Meet / Teams / Slack / Zoom call raises.
          HUGINN_UI_PROBE=prompt "$APP/Contents/MacOS/Huginn" >> "$RUNNER_TEMP/ui.log" 2>&1 &
          sleep 10
          screencapture -x shots/prompt.png || echo "screencapture failed (prompt)"
          pkill -x Huginn || true
          sleep 2
          # The optional windows: recorder panel, Notes window, dictation pill.
          HUGINN_UI_PROBE=windows "$APP/Contents/MacOS/Huginn" >> "$RUNNER_TEMP/ui.log" 2>&1 &
          sleep 14
          screencapture -x shots/windows.png || echo "screencapture failed (windows)"
          pkill -x Huginn || true
          cat "$RUNNER_TEMP/ui.log" || true
          cat "$HUGINN_DATA_DIR/huginn.log" || true

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: Huginn-screenshots
          path: shots/
          if-no-files-found: warn

      # Live capture needs permissions a user grants by hand; a refusal here is information, not a failure.
      - name: Probe live capture
        continue-on-error: true
        timeout-minutes: 6
        run: |
          set -uo pipefail
          export HUGINN_DATA_DIR="$RUNNER_TEMP/huginn-capture"
          mkdir -p "$HUGINN_DATA_DIR"
          cp "$RUNNER_TEMP/huginn-data/ggml-large-v3-turbo.bin" "$HUGINN_DATA_DIR/"
          ( sleep 2; for i in 1 2 3; do afplay "$RUNNER_TEMP/probe.aiff"; done ) &
          set +e
          HUGINN_SELFTEST=capture HUGINN_SELFTEST_EXPECT=inventory "$APP/Contents/MacOS/Huginn"
          echo "capture self-test exit $?  (0 ok, 2 could not start, 3 words missing, 5 silent)"
          exit 0

      - name: Package
        run: |
          set -euo pipefail
          ditto -c -k --keepParent "$APP" Huginn.zip
          ls -lh Huginn.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Huginn-macOS
          path: Huginn.zip
          if-no-files-found: error

  # Every hand-started build becomes a GitHub Release with both zips, so anyone can download Huginn from
  # https://github.com/BohdanRoshko/huginn/releases/latest without building it or signing in.
  release:
    if: github.event_name == 'workflow_dispatch'
    needs: [windows, mac]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Huginn-macOS
          path: mac-zip
      - uses: actions/download-artifact@v4
        with:
          name: Huginn-Windows-x64
          path: win-zip
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mv mac-zip/Huginn.zip Huginn-macOS.zip
          mv win-zip/Huginn-Windows-x64.zip Huginn-Windows-x64.zip
          VERSION="2.0.${{ github.run_number }}"
          gh release create "v$VERSION" Huginn-macOS.zip Huginn-Windows-x64.zip \
            --repo "${{ github.repository }}" --target "${{ github.sha }}" --latest \
            --title "Huginn $VERSION" \
            --notes "Built from ${{ github.sha }}. Mac: unzip, move Huginn.app to Applications, see the README for the first launch. Windows: needs the .NET 10 Desktop Runtime; unzip and run Huginn.exe."
